[workspace]
authors = ["Brian D. Klahn <brian.klahn@klahnpages.net>"]
channels = ["conda-forge"]
name = "grok-build"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Build the TUI and install it as `grok` into this env.
install-grok = "cargo build --release -p xai-grok-pager-bin && install -D -m 755 target/release/xai-grok-pager \"$CONDA_PREFIX/bin/grok\" && ln -sfn grok \"$CONDA_PREFIX/bin/xai-grok-pager\""

[dependencies]
rust = "1.94.*"
pkg-config = ">=0.29.2,<0.30"
protobuf = ">=7.35.1,<8"
sysroot_linux-64 = ">=2.38"
